# Maintains one record per PR AUTHOR of the mistakes they repeat, so a future review of their work can
# check their known patterns first. Kept separate from `knowledge-extraction` because the two answer
# different questions: that one asks "what should EVERY future review know?", this one asks "what does
# THIS developer keep getting wrong?" — and a lesson can be durable for one and noise for the other.
#
