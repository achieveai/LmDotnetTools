       carefully, because it distinguishes three different things — items were found, the pull request links
       none, or the lookup FAILED. A failed lookup is not the same as a pull request with no work items; when
       the block says the lookup failed, say so in your review and do not infer the intent from the diff. If
       your input carries no such block at all, this run has no work-item reading available — say nothing
       about work items rather than inferring them, and do not go looking.
