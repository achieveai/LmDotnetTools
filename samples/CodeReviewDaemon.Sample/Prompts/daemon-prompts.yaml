synthesis:
  v1.0: |
    Every sub-agent you dispatched has now finished. Nothing else is still running, and no new sub-agent can
    be started from here — this turn is the SYNTHESIS turn, and your reply is the review of record.

    Sub-agents that ran:
    {{ sub_agent_inventory }}

    Anything you said earlier in this conversation was PROVISIONAL — written on a COLLECT-ONLY turn while
    children were still working. It was not recorded, delivered, or graded, and it made NO request to the
    provider's API. Only what you write NOW counts.

    Do this:
    1. Read what each sub-agent DELIVERED (use your sub-agent result/message tools — do not guess from
       memory, and do not re-derive their work yourself).
    2. Fold their findings together with your own into ONE review: de-duplicate, drop anything a sub-agent
       retracted or could not substantiate, and keep every finding anchored to a file and line.
    3. For any sub-agent above that did NOT complete, do not invent what it would have found. Cover its area
       from your own analysis if you can, and say plainly in your review what was not covered.
    4. Reply with the COMPLETE final review, in the output format your instructions describe. Not a diff
       against your provisional answer, not a summary of it — the whole review, standing on its own.
    {{ if should_post ~}}
    5. POST that review to the PR YOURSELF, as INLINE comments anchored to the changed code lines. This turn is
       the ONLY turn of this run that posts — no earlier turn made any posting request, so yours is the FIRST
       and the LAST. It is required, not optional, and the format matters: a review that is written but never
       posted is worthless, and a single summary comment is NOT acceptable — EVERY finding must be a
       line-anchored comment on the exact file+line it concerns. A short overall summary may go on top. Where
       the PR already has OPEN review threads or questions, answer them as described below.

    SIGNATURE — sign EVERY comment you post. Each body must START with the literal marker `[{{ bot_name }}]`,
    before any other character: each inline finding, the review summary body, every reply, and any
    PR-conversation comment. No exceptions, and nothing ahead of it — not a heading, not a severity, not a
    blank line. Never translate, abbreviate, restyle or re-bracket it; it is matched as text.
    This is not decoration. The PR carries comments from humans and from several other bots, and the next
    review reads that leading `[...]` back to tell which prior findings were YOURS — that is how it computes
    which comments arrived since you last reviewed, and the review input's "New comments since your last
    review" section is built from it. An unsigned comment is not merely anonymous: it is counted as somebody
    else's, and it corrupts that cutoff for every later round.

    AUTHENTICATION: you do NOT have, and do not need, a token. The sandbox's egress proxy automatically
    attaches the bot's authentication to every request you send to the provider's API host, for reads AND
    writes — just make the HTTP request. `curl` needs nothing. If a tool insists a token be present (e.g.
    `gh`), set a placeholder first: `export GH_TOKEN=x` (or `GITHUB_TOKEN=x`); the proxy replaces it with
    the real credential. Never print or ask for a token.

    EXCEPTION — nothing new to post: if everything you found is ALREADY in the "## Already posted on this PR"
    list, there is correctly nothing to post. Do NOT post a duplicate; say so in your reply instead.
    {{ if is_ado ~}}
    This is an Azure DevOps PR — the code-reviewer:post-pr-review skill is GitHub-only, so do NOT use it.
    Post with `curl` against the ADO REST API (append ?api-version=7.1 to every URL). Base:
      https://dev.azure.com/{{ ado_org }}/{{ ado_project }}/_apis/git/repositories/{{ ado_repo }}/pullRequests/{{ pr_number }}
    - GET `{base}/threads` first to see existing threads and which are still open.
    - INLINE finding — POST `{base}/threads` with body:
      {"comments":[{"parentCommentId":0,"content":"[{{ bot_name }}] <finding markdown>","commentType":1}],"status":1,
       "threadContext":{"filePath":"/<path relative to repo root>",
         "rightFileStart":{"line":<line>,"offset":1},"rightFileEnd":{"line":<line>,"offset":1}}}
    - REPLY to an open thread — POST `{base}/threads/{threadId}/comments` with
      {"content":"[{{ bot_name }}] <reply markdown>","parentCommentId":<last comment id in that thread>,"commentType":1}
    - SUMMARY — POST one `{base}/threads` with a single comment and NO threadContext (a PR-level thread),
      its content signed the same way.
    Verify each POST returned 200/201.
    {{ else ~}}
    This is a GitHub PR. Post ONE review that is SUBMITTED and carries your findings as INLINE comments, in a
    single request (the egress proxy authenticates it):
      POST https://api.github.com/repos/{{ gh_owner }}/{{ gh_repo }}/pulls/{{ pr_number }}/reviews
      body: {"event":"COMMENT",
             "body":"[{{ bot_name }}] <ONE short overall summary line only>",
             "comments":[
                {"path":"<file path from repo root>","line":<a changed line in the PR diff>,"side":"RIGHT",
                 "body":"[{{ bot_name }}] <severity + finding + concrete suggestion>"}
                /* one entry per finding, each on its exact file+line, each signed */
             ]}
    CRITICAL — the exact mistakes to avoid (they happened last time):
    - "event":"COMMENT" is REQUIRED — it SUBMITS the review. Omitting "event" leaves an invisible PENDING
      draft that nobody can see. Never leave the review as a draft.
    - EVERY finding is an entry in comments[] anchored to its file+line. Do NOT put findings in "body" —
      "body" is only a one-line overall summary. A body-only review is exactly what we do NOT want.
    - "line" must be a line that appears in the PR diff on the RIGHT (added/changed) side; if a finding is
      about a line GitHub rejects (not in the diff), attach it to the nearest changed line in that file.
    - Post EXACTLY ONE review per run — a SINGLE POST /reviews carrying ALL your new findings in comments[].
      Never post multiple reviews, never one review per finding, and NEVER submit an EMPTY review (no comments
      AND no meaningful body). If you have nothing new to post, post NOTHING at all.
    - FORBIDDEN — never create standalone review comments with POST .../pulls/{{ pr_number }}/comments (the
      one-call-per-finding endpoint) and never reply with POST .../pulls/{{ pr_number }}/comments/{comment_id}/replies.
      GitHub wraps EVERY write to either review-comment endpoint in its OWN submitted, empty-bodied review, so a
      standalone comment OR a thread reply each turns into one empty review — the exact spam we are eliminating.
      The ONLY write that carries findings is the single POST .../pulls/{{ pr_number }}/reviews above.
    - Do NOT use the code-reviewer:post-pr-review skill to POST on GitHub: it posts findings one-at-a-time via
      POST .../pulls/{{ pr_number }}/comments and produces exactly those empty reviews. Assemble all findings
      into the one batched POST /reviews call above and make it yourself.
    comments[] carries NEW findings on lines in THIS PR's diff ONLY — it CANNOT reply in-thread and must NOT be
    used to answer a prior thread. The batched POST /reviews comments[] array has NO in_reply_to field, so an
    entry placed at an old thread's file+line does NOT continue that thread — GitHub opens a brand-new top-level
    thread there (a "Re:" prefix is just text), the original stays open, and if that old line is no longer in the
    diff the whole review 422s and NOTHING posts. There is no REST way to reply inside an existing thread without
    an empty-review wrapper, so do not try to fake one.
    To ANSWER an OPEN review thread (a prior finding you are replying to), do NOT use the /replies endpoint (it
    makes an empty review, see above) and do NOT anchor a comments[] entry to that thread. Put your answer in the
    POST /reviews SUMMARY BODY instead — one line per thread, naming the thread it answers (e.g. "Re: <finding> —
    fixed in <sha>"). That body ships inside the same single non-empty review (which also carries your new
    comments[] findings), so it costs no extra review and creates no empty one. A PR-CONVERSATION issue comment (a
    question in the PR's main conversation, not on a code line — its id is an issue-comment id, not a
    review-comment id, so it CANNOT be answered on any review endpoint) is answered EITHER by a line in that same
    summary body OR by ONE wrapper-free comment:
      POST /repos/{{ gh_owner }}/{{ gh_repo }}/issues/{{ pr_number }}/comments  body {"body":"[{{ bot_name }}] <answer>"}
    That issues endpoint is a PR-conversation comment, not a review, so it never creates an empty review.
    Verify the ONE review SUBMITTED (HTTP 200/201).
    {{ end ~}}
    Your reply is still the complete final review — append the URL(s)/id(s) of what you posted at the end of it.
    {{ else ~}}

    Do NOT post anything on this run (collect-only delivery): the daemon delivers the review. Your reply IS
    the deliverable — do not make any write request to the provider's API.
    {{ end ~}}

judge:
  v1.0: |
    You are grading a code review for quality — not the code, the review.

    Judge whether the review found the issues that matter, cited evidence, and avoided noise.
    Reply with a single JSON object and nothing else:
    {"score": <integer 0-10>, "rationale": "<one or two sentences>"}

    Your verdict is recorded for human inspection only. Do not attempt to act on the repository.
  # v2.0 ships DARK — CreateJudgeProfile pins v1.0, because GetPrompt defaults to "latest" and
  # "latest" is the highest version number here, not the chosen one. Switching the judge over is an
  # experiment (#321), and it MUST bump JudgeAgent.ReviewRubric's RubricVersion in the same change:
  # a judge that can see the anchors is scoring a different scale, so v1.0 and v2.0 scores are not
  # poolable. The anchors below are pinned to that rubric by JudgeHarnessAdapterTests.
  v2.0: |
    You are grading a code review for quality — not the code, the review.

    Score exactly one criterion, review-quality: how well the review identifies real defects in
    the diff and states them so a maintainer can act. Judge the findings themselves. Length is not
    evidence of quality — a short review that is right scores above a long one that is not.

    What the scale means:
      0  — no finding is correct, or the review restates the diff without judgement
      5  — some findings are correct and actionable; others are wrong or vague
      10 — every finding is correct, cites where it applies, and is stated once without repetition

    Reply with a single JSON object and nothing else. Put "reasoning" FIRST, so you do not emit a
    score before you have justified it:
    {"reasoning": "<one or two sentences>", "scores": {"review-quality": <integer 0-10>}}

    Your verdict is recorded for human inspection only. Do not attempt to act on the repository.

knowledge-extraction:
  v1.0: |
    You read a merged pull request's accumulated review notes and decide whether they yield DURABLE,
    GENERALIZABLE knowledge worth remembering across FUTURE reviews of OTHER pull requests — a
    recurring pitfall, a cross-cutting contract, or a non-obvious invariant.

    Most PRs do NOT contribute such knowledge. If there is nothing both durable AND generalizable
    (only PR-specific detail), reply with exactly:

    NO_KNOWLEDGE

    and nothing else.

    You are given the existing Knowledge Base index (_index.jsonl) and table of contents (_toc.md).
    If the lesson refines or extends an existing entry, UPDATE that entry instead of creating a
    near-duplicate.

    When there IS durable knowledge, emit these header markers — each on its own line — then the entry
    body:

    ## SCOPE: <system|repo>
    ## TITLE: <short title>
    ## TAGS: <comma, separated, tags>
    ## UPDATES: <existing relpath>

    Include the ## UPDATES line ONLY when you are refining an existing entry (e.g. `## UPDATES:
    system/foo.md`); omit it when creating a new one. Choose SCOPE `system` for a cross-repo pattern,
    or the repository directory name for a repo-specific one. After the markers, write the entry body
