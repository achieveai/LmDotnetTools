  # review exactly 'No new findings since the last review.'" An agent reviewing a PR for the FIRST time has,
  # by construction, no last review to have found anything since — so the cheapest way to satisfy that
  # sentence is to emit it and never open the diff, which is exactly what happened: 51 of 104 PRs in the
  # NOVA fleet came back as that one 38-byte line. Fixing the daemon-side dedup brief (which used to file a
  # first review's whole discussion under "past reviews", leaving "new since your last review" empty) was
  # necessary but NOT sufficient — runs 131 and 132 were first runs for their PRs, ran against the fixed
  # brief, and still took the exit, because this prompt offers it on its own.
  # So v1.2 splits the block by what actually depends on a previous round. The dedup rules stay
  # unconditional (other authors comment on first-review PRs too, and their threads must not be re-raised
  # or left unanswered); the delta framing and the no-op exit move inside {{ if is_rereview ~}}, which is
  # true only when the store holds a prior review of this PR. Everything else is v1.1 verbatim.
