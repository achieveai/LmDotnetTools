version: 1
objective: Review new code, respond to a frozen discussion window, or judge and retain completed or abandoned PR learnings.
inputType: Admission

types:
  Admission:
    type: object
    additionalProperties: false
    required: [Route, PrId, HeadSha, WindowId]
    properties:
      Route: {type: string, enum: [new_head, discussion, merged, abandoned]}
      PrId: {type: string, minLength: 1}
      HeadSha: {type: string, minLength: 1}
      WindowId: {type: string}
  Prepared:
    type: object
    additionalProperties: false
    required: [PrId, HeadSha, WindowId, ContextArtifact]
    properties:
      PrId: {type: string}
      HeadSha: {type: string}
      WindowId: {type: string}
      ContextArtifact: {type: string, minLength: 1}
      PublicationMode: {type: string}
  Finding:
    type: object
    additionalProperties: false
    required: [Id, Severity, Path, Line, Description]
    properties:
      Id: {type: string, minLength: 1}
      Severity: {type: string, enum: [Must, Should, Consider]}
      Path: {type: string}
      Line: {type: integer, minimum: 1}
      Description: {type: string}
  Review:
    type: object
    additionalProperties: false
    required: [Findings, ReviewText]
    properties:
      Findings: {type: array, items: {$ref: '#/$defs/Finding'}}
      ReviewText: {type: string}
  GradeInput:
    type: object
    additionalProperties: false
    required: [Prepared, Review]
    properties:
      Prepared: {$ref: '#/$defs/Prepared'}
      Review: {$ref: '#/$defs/Review'}
  Grade:
    type: object
    additionalProperties: false
    required: [Assessments, Description]
    properties:
      Assessments:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [Id, Supported, Description]
          properties:
            Id: {type: string}
            Supported: {type: boolean}
            Description: {type: string}
      Description: {type: string}
  PublicationInput:
    type: object
    additionalProperties: false
    required: [Admission, Prepared, Review, Grade]
    properties:
      Admission: {$ref: '#/$defs/Admission'}
      Prepared: {$ref: '#/$defs/Prepared'}
      Review: {$ref: '#/$defs/Review'}
      Grade: {$ref: '#/$defs/Grade'}
  PostReviewInput:
    type: object
    additionalProperties: false
    required: [Admission, Report]
    properties:
      Admission: {$ref: '#/$defs/Admission'}
      Report: {$ref: '#/$defs/MarkdownReport'}
  Publication:
    type: object
    additionalProperties: false
    required: [Outcome, Description, Actions]
    properties:
      Outcome: {type: string, enum: [published, replied, no_op]}
      Description: {type: string}
      Actions: {type: array, items: {$ref: '#/$defs/PublicationAction'}}
  PublicationAction:
    type: object
    additionalProperties: false
    required: [ActionId, ReceiptId]
    properties:
      ActionId: {type: string, minLength: 1}
      ReceiptId: {type: integer, minimum: 1}
  Discussion:
    type: object
    additionalProperties: false
    required: [Outcome, Description, Actions]
    properties:
      Outcome: {type: string, enum: [replied, no_op]}
      Description: {type: string}
      Actions: {type: array, items: {$ref: '#/$defs/PublicationAction'}}
  Extraction:
    type: object
    additionalProperties: false
    required: [Edits, Description]
    properties:
      Edits:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [Path, Content]
          properties:
            Path: {type: string, minLength: 1}
            Content: {type: string}
      Description: {type: string}
  KnowledgeReviewInput:
    type: object
    additionalProperties: false
    required: [Extractions]
    properties:
      Extractions: {type: array, items: {$ref: '#/$defs/Extraction'}}
  KnowledgeReview:
    type: object
    additionalProperties: false
    required: [Verdict, Reviewed, Description]
    properties:
      Verdict: {type: string, enum: [approved, rejected]}
      Reviewed: {$ref: '#/$defs/Extraction'}
      Description: {type: string}
  CanonicalReview:
    type: object
    additionalProperties: false
    required: [Review, Grade, Publication]
    properties:
      Review: {$ref: '#/$defs/Review'}
      Grade: {$ref: '#/$defs/Grade'}
      Publication: {$ref: '#/$defs/Publication'}
  TerminalPrepared:
    type: object
    additionalProperties: false
    required: [PrId, HeadSha, WindowId, ContextArtifact, TerminalState]
    properties:
      PrId: {type: string}
      HeadSha: {type: string}
      WindowId: {type: string}
      ContextArtifact: {type: string, minLength: 1}
      PublicationMode: {type: string}
      TerminalState: {type: string, enum: [Merged, Abandoned]}
  MergedLearningInput:
    type: object
    additionalProperties: false
    required: [Prepared, SelfAssessment]
    properties:
      Prepared: {$ref: '#/$defs/TerminalPrepared'}
      SelfAssessment: {$ref: '#/$defs/MarkdownReport'}
  TerminalJudgmentInput:
    type: object
    additionalProperties: false
    required: [Prepared, SelfAssessment, Learnings]
    properties:
      Prepared: {$ref: '#/$defs/TerminalPrepared'}
      SelfAssessment: {$ref: '#/$defs/MarkdownReport'}
      Learnings: {$ref: '#/$defs/Extraction'}
  MergedCanonical:
    type: object
    additionalProperties: false
    required: [SelfAssessment, Learnings, Judgment]
    properties:
      SelfAssessment: {$ref: '#/$defs/MarkdownReport'}
      Learnings: {$ref: '#/$defs/Extraction'}
      Judgment: {$ref: '#/$defs/KnowledgeReview'}
  MergedRetentionInput:
    type: object
    additionalProperties: false
    required: [Admission, Extractions, KnowledgeReview, Canonical]
    properties:
      Admission: {$ref: '#/$defs/Admission'}
      Extractions: {type: array, items: {$ref: '#/$defs/Extraction'}}
      KnowledgeReview: {$ref: '#/$defs/KnowledgeReview'}
      Canonical: {$ref: '#/$defs/MergedCanonical'}
  Statistics:
    type: object
    additionalProperties: false
    required: [RunId, ArtifactCount, ArtifactCountsByKind, ReceiptCount, ReceiptCountsByStatus]
    properties:
      RunId: {type: string}
      ArtifactCount: {type: integer, minimum: 0}
      ArtifactCountsByKind: {type: object, additionalProperties: {type: integer, minimum: 0}}
      ReceiptCount: {type: integer, minimum: 0}
      ReceiptCountsByStatus: {type: object, additionalProperties: {type: integer, minimum: 0}}
  MarkdownReport:
    type: object
    additionalProperties: false
    required: [Format, Markdown]
    properties:
      Format: {type: string, const: markdown}
      Markdown: {type: string, minLength: 1}
  MarkdownGradeInput:
    type: object
    required: [Prepared, Review]
    properties:
      Prepared: {$ref: '#/$defs/Prepared'}
      Review: {$ref: '#/$defs/MarkdownReport'}
  MarkdownCommentsInput:
    type: object
    required: [Prepared, Review, Grade]
    properties:
      Prepared: {$ref: '#/$defs/Prepared'}
      Review: {$ref: '#/$defs/MarkdownReport'}
      Grade: {$ref: '#/$defs/MarkdownReport'}
  DiscussionSnapshot:
    type: object
    required: [ReviewRunId, HeadSha, CapturedAt, CommentBaseline, CommentWindow]
    properties:
      ReviewRunId: {type: integer}
      HeadSha: {type: string}
      CapturedAt: {type: string}
      CommentBaseline: {type: array}
      CommentWindow: {type: array}
  PerformanceInput:
    type: object
    required: [Prepared, Review, Grade, Comments, Discussion]
    properties:
      Prepared: {$ref: '#/$defs/Prepared'}
      Review: {$ref: '#/$defs/MarkdownReport'}
      Grade: {$ref: '#/$defs/MarkdownReport'}
      Comments: {$ref: '#/$defs/MarkdownReport'}
      Discussion: {$ref: '#/$defs/DiscussionSnapshot'}
  MarkdownCanonical:
    type: object
    required: [Review, Grade, Comments, Discussion, Performance, Publication]
    properties:
      Review: {$ref: '#/$defs/MarkdownReport'}
      Grade: {$ref: '#/$defs/MarkdownReport'}
      Comments: {$ref: '#/$defs/MarkdownReport'}
      Discussion: {$ref: '#/$defs/DiscussionSnapshot'}
      Performance: {$ref: '#/$defs/MarkdownReport'}
      Publication: {$ref: '#/$defs/Publication'}
  MarkdownRetentionInput:
    type: object
    required: [Admission, Extractions, Canonical]
    properties:
      Admission: {$ref: '#/$defs/Admission'}
      Extractions: {type: array, maxItems: 0}
      Canonical: {$ref: '#/$defs/MarkdownCanonical'}
  RetentionInput:
    type: object
    additionalProperties: false
    required: [Admission, Extractions]
    properties:
      Admission: {$ref: '#/$defs/Admission'}
      Extractions: {type: array, items: {$ref: '#/$defs/Extraction'}}
      KnowledgeReview: {$ref: '#/$defs/KnowledgeReview'}
      Canonical: {$ref: '#/$defs/CanonicalReview'}
  Retention:
    type: object
    additionalProperties: false
    required: [ArtifactBranch, RetainedSha]
    properties:
      ArtifactBranch: {type: string, minLength: 1}
      RetainedSha: {type: string, minLength: 1}
  Closure:
    type: object
    additionalProperties: false
    required: [ArtifactBranch, Closed]
    properties:
      ArtifactBranch: {type: string, minLength: 1}
      Closed: {type: boolean, const: true}

steps:
  - id: start
    kind: start
    next: route
  - id: route
    kind: branch
    branches:
      - when: inputs.Route == "new_head"
        goto: prepare-independent
      - when: inputs.Route == "discussion"
        goto: prepare-discussion
    else: prepare-history

  - id: prepare-independent
    kind: script
    script: scripts/prepare-independent.py
    inputType: Admission
    input: {from: inputs}
    outputType: Prepared
    saveAs: PreparedReview
    next: review-mode
  - id: review-mode
    kind: branch
    branches:
      - when: state.PreparedReview.PublicationMode == "collect_only"
        goto: independent-review
    else: review
  - id: independent-review
    kind: agent
    session: review-parent
    skills: [skills/artifact-boundary.md, skills/independent-review.md]
    prompt: Review independently without reading existing PR discussions. Return a complete Markdown review.
    inputType: Prepared
    input: {from: state.PreparedReview}
    outputType: MarkdownReport
    saveAs: IndependentReview
    next: independent-grade
  - id: independent-grade
    kind: agent
    session: review-grader
    skills: [skills/artifact-boundary.md, skills/independent-grade.md]
    prompt: Grade the proposed findings against source evidence without reading PR discussion. Return Markdown.
    inputType: MarkdownGradeInput
    input:
      Prepared: {from: state.PreparedReview}
      Review: {from: state.IndependentReview}
    outputType: MarkdownReport
    saveAs: IndependentGrade
    next: collect-comments
  - id: collect-comments
    kind: agent
    session: review-parent
    skills: [skills/artifact-boundary.md, skills/collect-comments.md]
    prompt: Incorporate the independent grade and write final proposed review comments in Markdown. Do not read PR discussion or post comments.
    inputType: MarkdownCommentsInput
    input:
      Prepared: {from: state.PreparedReview}
      Review: {from: state.IndependentReview}
      Grade: {from: state.IndependentGrade}
    outputType: MarkdownReport
    saveAs: CollectedComments
    next: fetch-discussion
  - id: fetch-discussion
    kind: script
    script: scripts/fetch-discussion.py
    inputType: Admission
    input: {from: inputs}
    outputType: DiscussionSnapshot
    saveAs: DeferredDiscussion
    next: assess-performance
  - id: assess-performance
    kind: agent
    session: review-parent
    skills: [skills/artifact-boundary.md, skills/assess-performance.md]
    prompt: Assess your frozen review against the newly supplied discussion. Explain misses and their causes, your false positives, and incorrect existing findings. Return an evidence-based Markdown self-assessment.
    inputType: PerformanceInput
    input:
      Prepared: {from: state.PreparedReview}
      Review: {from: state.IndependentReview}
      Grade: {from: state.IndependentGrade}
      Comments: {from: state.CollectedComments}
      Discussion: {from: state.DeferredDiscussion}
    outputType: MarkdownReport
    saveAs: Performance
    next: collect-publication
  - id: collect-publication
    kind: script
    script: scripts/collect-publication.py
    inputType: Admission
    input: {from: inputs}
    outputType: Publication
    saveAs: CollectedPublication
    next: retain-independent
  - id: retain-independent
    kind: script
    script: scripts/retain-artifacts.py
    inputType: MarkdownRetentionInput
    input:
      Admission: {from: inputs}
      Extractions: []
      Canonical:
        Review: {from: state.IndependentReview}
        Grade: {from: state.IndependentGrade}
        Comments: {from: state.CollectedComments}
        Discussion: {from: state.DeferredDiscussion}
        Performance: {from: state.Performance}
        Publication: {from: state.CollectedPublication}
    outputType: Retention
    saveAs: ReviewRetention
    next: complete

  - id: review
    kind: agent
    session: review-parent
    skills: [skills/review.md]
    prompt: Review the exact prepared change, settle all specialists, and return structured draft findings.
    inputType: Prepared
    input: {from: state.PreparedReview}
    outputType: Review
    saveAs: Review
    maxValidationRetries: 1
    next: grade
  - id: grade
    kind: agent
    session: review-grader
    skills: [skills/grade.md]
    prompt: Independently assess every candidate finding and preserve its stable identity.
    inputType: GradeInput
    input:
      Prepared: {from: state.PreparedReview}
      Review: {from: state.Review}
    outputType: Grade
    saveAs: Grade
    maxValidationRetries: 1
    next: final-review
  - id: final-review
    kind: agent
    session: review-parent
    skills: [skills/collect-comments.md]
    prompt: Incorporate the grade and return the final review in Markdown. Remove unsupported findings. Do not post, reply, investigate further or spawn agents. The daemon posts your validated report.
    inputType: PublicationInput
    input:
      Admission: {from: inputs}
      Prepared: {from: state.PreparedReview}
      Review: {from: state.Review}
      Grade: {from: state.Grade}
    outputType: MarkdownReport
    saveAs: FinalReview
    next: publish
  - id: publish
    kind: script
    script: scripts/publish-review.py
    inputType: PostReviewInput
    input:
      Admission: {from: inputs}
      Report: {from: state.FinalReview}
    outputType: Publication
    saveAs: Publication
    next: retain-review
  - id: retain-review
    kind: script
    script: scripts/retain-artifacts.py
    inputType: RetentionInput
    input:
      Admission: {from: inputs}
      Extractions: []
      Canonical:
        Review: {from: state.Review}
        Grade: {from: state.Grade}
        Publication: {from: state.Publication}
    outputType: Retention
    saveAs: ReviewRetention
    next: complete

  - id: prepare-discussion
    kind: script
    script: scripts/prepare-discussion.py
    inputType: Admission
    input: {from: inputs}
    outputType: Prepared
    saveAs: PreparedDiscussion
    next: discussion
  - id: discussion
    kind: agent
    session: review-parent
    skills: [skills/discussion.md]
    tools: [review_reply]
    prompt: Address the frozen message window through scoped reply tools, or explicitly choose no_op.
    inputType: Prepared
    input: {from: state.PreparedDiscussion}
    outputType: Discussion
    saveAs: Discussion
    maxValidationRetries: 1
    next: retain-discussion
  - id: retain-discussion
    kind: script
    script: scripts/retain-artifacts.py
    inputType: RetentionInput
    input:
      Admission: {from: inputs}
      Extractions: []
    outputType: Retention
    saveAs: DiscussionRetention
    next: complete

  - id: prepare-history
    kind: script
    script: scripts/prepare-history.py
    inputType: Admission
    input: {from: inputs}
    outputType: TerminalPrepared
    saveAs: PreparedHistory
    next: merged-self-assessment
  - id: merged-self-assessment
    kind: agent
    session: merged-self-assessment
    skills: [skills/merged-self-assessment.md]
    prompt: Self-review the available original review and discussion against the actual completed or abandoned PR outcome. State missing evidence plainly; do not pretend abandoned code landed.
    inputType: TerminalPrepared
    input: {from: state.PreparedHistory}
    outputType: MarkdownReport
    saveAs: MergedSelfAssessment
    maxValidationRetries: 1
    next: learnings
  - id: learnings
    kind: agent
    session: merged-learnings
    skills: [skills/learnings.md]
    prompt: Extract evidence-backed knowledge, developer learnings and missing review or process steps from the self-review and available evidence. Return proposed edits only.
    inputType: MergedLearningInput
    input:
      Prepared: {from: state.PreparedHistory}
      SelfAssessment: {from: state.MergedSelfAssessment}
    outputType: Extraction
    saveAs: Learnings
    maxValidationRetries: 1
    next: merged-judgment
  - id: merged-judgment
    kind: agent
    session: merged-process-judge
    skills: [skills/process-judge.md, skills/knowledge-safety.md]
    prompt: Judge the proposed knowledge, developer learnings and missing-process remedies against the raw evidence. Return one KnowledgeReview with only supported, safe edits in Reviewed; include your independently reasoned assessment in Description.
    inputType: TerminalJudgmentInput
    input:
      Prepared: {from: state.PreparedHistory}
      SelfAssessment: {from: state.MergedSelfAssessment}
      Learnings: {from: state.Learnings}
    outputType: KnowledgeReview
    saveAs: MergedJudgment
    maxValidationRetries: 1
    next: collect-statistics
  - id: collect-statistics
    kind: script
    script: scripts/collect-statistics.py
    inputType: Admission
    input: {from: inputs}
    outputType: Statistics
    saveAs: Statistics
    next: retain-merged
  - id: retain-merged
    kind: script
    script: scripts/retain-artifacts.py
    inputType: MergedRetentionInput
    input:
      Admission: {from: inputs}
      Extractions: [{from: state.MergedJudgment.Reviewed}]
      KnowledgeReview: {from: state.MergedJudgment}
      Canonical:
        SelfAssessment: {from: state.MergedSelfAssessment}
        Learnings: {from: state.Learnings}
        Judgment: {from: state.MergedJudgment}
    outputType: Retention
    saveAs: MergedRetention
    next: terminal-outcome
  - id: terminal-outcome
    kind: branch
    branches:
      - when: state.PreparedHistory.TerminalState == "Merged"
        goto: close-artifact-branch
    else: complete
  - id: close-artifact-branch
    kind: script
    script: scripts/close-artifact-branch.py
    inputType: Retention
    input: {from: state.MergedRetention}
    outputType: Closure
    saveAs: Closure
    next: complete
  - id: complete
    kind: end
