name: Build and Test

on:
  # Manual trigger. The only other events here are webhook-driven, and when GitHub drops
  # those there is no recovery path: a dropped `pull_request` never creates a check suite,
  # so there is no run to re-run and nothing for `gh workflow run` to invoke. That happened
  # to this repo on 2026-08-06 — four consecutive commits on a PR branch, zero check suites
  # each, nothing queued, and a new push the only way to get a run at all. This is the lever
  # for that case.
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    # Matching v<version> tags can safely retry a deterministic main release.
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  # Only PR runs are cancelled by a newer push. A main or tag run may be mid-way through pushing
  # packages, and cancelling it there would ship part of a version.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-tooling:
    name: Test inventory and priority tooling
    runs-on: windows-latest
    # The full-repository policy regression takes about nine minutes on hosted Windows.
    # Leave room for checkout, the other tooling tests, and runner speed variation.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Separate processes isolate fixture mocks; this job does not replace the full test gate.
      - name: Test static inventory
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/Get-TestInventory.Tests.ps1
          exit $LASTEXITCODE

      - name: Test impact selection
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/select-impacted-tests.Tests.ps1
          exit $LASTEXITCODE

      - name: Test full-gate telemetry contract
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/ci-test-telemetry.Tests.ps1
          exit $LASTEXITCODE

      - name: Test package versions and publishing
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/package-release.Tests.ps1
          exit $LASTEXITCODE

      - name: Test priority policy and runner
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/run-priority-tests.Tests.ps1
          exit $LASTEXITCODE

  build-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x

      - name: Collect changed paths for test-impact shadow
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          New-Item -ItemType Directory -Path .logs -Force | Out-Null
          $changedPathFile = ".logs/test-impact-changed-paths.txt"
          $baseSha = $env:BASE_SHA
          if ([string]::IsNullOrWhiteSpace($baseSha) -or $baseSha -match '^0+$') {
            New-Item -ItemType File -Path $changedPathFile -Force | Out-Null
            exit 0
          }

          try {
            $paths = @(git diff --name-only $baseSha $env:GITHUB_SHA)
            if ($LASTEXITCODE -ne 0) {
              throw "git diff exited $LASTEXITCODE"
            }
            Set-Content -Path $changedPathFile -Value $paths -Encoding utf8
          }
          catch {
            Write-Warning "Could not collect changed paths; the full test gate will remain authoritative: $($_.Exception.Message)"
            New-Item -ItemType File -Path $changedPathFile -Force | Out-Null
          }

      - name: Validate build and tests
        shell: pwsh
        run: ./scripts/ci-test.ps1 -ChangedPathFile .logs/test-impact-changed-paths.txt

      - name: Upload test-impact shadow decision
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-impact-shadow
          path: .logs/test-impact-shadow.json
          if-no-files-found: ignore
          retention-days: 14

  packages:
    # Each first-parent main commit after the recorded published baseline adds one stable patch.
    # PRs validate the next target-main version with a preview suffix and never publish.
    # Retrying a SHA (including a matching v* tag) reuses the same package version.
    #
    # Publishing uses nuget.org Trusted Publishing: no API key is stored. NuGet/login exchanges this
    # job's GitHub OIDC token for a one-hour key, which only works while a nuget.org policy trusts
    # achieveai/LmDotnetTools + ci.yml. `vars.NUGET_USER` is the nuget.org profile that owns that policy.
    name: Pack and publish NuGet packages
    needs: [build-test, test-tooling, daemon-tests-linux, clientapp-tests, python-requirements]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x

      - name: Choose the package version label
        id: version
        shell: pwsh
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $version = ./scripts/Get-PackageVersion.ps1 -Commit $env:GITHUB_SHA -EventName $env:GITHUB_EVENT_NAME -Ref $env:GITHUB_REF -PullRequestBase $env:PR_BASE_SHA -PullRequestNumber $env:PR_NUMBER -RunNumber $env:GITHUB_RUN_NUMBER | ConvertFrom-Json
          foreach ($property in @('version', 'major', 'minor', 'patch', 'label', 'publish')) {
            "$property=$($version.$property)" >> $env:GITHUB_OUTPUT
          }
          Write-Host "Packing $($version.version) from $($version.commit), main distance $($version.distance)"
          "## NuGet version: $($version.version)" >> $env:GITHUB_STEP_SUMMARY

      # Directory.Build.targets limits packing to projects with an AchieveAi.LmDotnetTools.* PackageId.
      - name: Pack
        shell: pwsh
        env:
          LABEL: ${{ steps.version.outputs.label }}
          MAJOR: ${{ steps.version.outputs.major }}
          MINOR: ${{ steps.version.outputs.minor }}
          PATCH: ${{ steps.version.outputs.patch }}
        run: |
          dotnet pack LmDotnetTools.sln -c Release -o out "-p:MajorVersion=$env:MAJOR" "-p:MinorVersion=$env:MINOR" "-p:PatchVersion=$env:PATCH" "-p:PreReleaseLabel=$env:LABEL"
          if ($LASTEXITCODE -ne 0) { throw "dotnet pack failed (exit $LASTEXITCODE)." }
          Get-ChildItem out -Filter *.nupkg | ForEach-Object { Write-Host $_.Name }

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: out/*
          if-no-files-found: error
          retention-days: 14

      # Logged in right before the push: the issued key lasts one hour and is good for one exchange.
      - name: NuGet login (OIDC to temporary API key)
        if: ${{ github.event_name == 'push' && steps.version.outputs.publish == 'True' }}
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      # --skip-duplicate makes a re-run of the same SHA safe. The .snupkg symbol packages
      # next to each .nupkg are pushed with it.
      - name: Push to nuget.org
        if: ${{ github.event_name == 'push' && steps.version.outputs.publish == 'True' }}
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          ./scripts/Push-NuGetPackages.ps1 -PackageDirectory out

  daemon-tests-linux:
    # The .NET gate above is windows-latest, and until this job existed that was the ONLY place .NET
    # tests ran. Some of the daemon's behaviour is not observable there at all: the orphaned-pack
    # sweeper's open-descriptor guard reads /proc/<pid>/fd, which has no Windows equivalent, so its
    # four tests are LinuxOnlyFact and report skipped on the Windows leg. A guard whose tests can only
    # ever skip is a guard nobody has run.
    #
    # Deliberately ONE project rather than the solution. The claim this job makes is narrow — "the
    # daemon's platform-sensitive behaviour holds on Linux" — and CodeReviewDaemon.Sample.Tests is
    # where all of it lives. Widening it to the solution would buy a second full test matrix, and the
    # duplicate coverage would be paid for on every PR. The Windows leg stays the whole-repo gate.
    name: Review daemon tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x

      # No formatting or packaging gate here: those are the Windows leg's job and repeating them would
      # only produce a second red for the same cause.
      - name: Run the review daemon test project
        run: dotnet test tests/CodeReviewDaemon.Sample.Tests/CodeReviewDaemon.Sample.Tests.csproj

  clientapp-tests:
    name: ClientApp unit tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: samples/LmStreaming.Sample/ClientApp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: samples/LmStreaming.Sample/ClientApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The client's fast unit layer, on every PR. Before this job the ~270 identity test lines
      # (#347/#348 - including the expire()/token-provider regression BE3 fixed) ran in NO always-on
      # CI job: only inside the path-filtered browser E2E workflow, behind a full SPA + Playwright
      # bring-up, so a red client suite could ship on a PR that did not touch the E2E trigger paths.
      # This runs them here, in seconds.
      #
      # Type-checks the vitest suite (tsconfig.vitest.json), which the app tsconfig deliberately
      # excludes. #406 cleared the ~11 test files with pre-existing errors this surfaced; this step
      # now gates so a renamed export, changed signature, or wrong mock shape fails CI instead of
      # rotting silently until someone runs the tests.
      - name: Type-check tests (vitest)
        run: npm run type-check:test

      - name: Run unit tests (vitest)
        run: npm run test:run

  python-requirements:
    # Nothing in CI has ever built McpServers/PythonMCPServer's image, so nothing ever noticed when
    # its requirements set stopped resolving. Two security bumps (bokeh==3.8.2, geopandas==1.1.2)
    # left `pip install -r requirements.txt` failing outright on the image's own base for MONTHS —
    # panel 1.3.6 caps bokeh at <3.4 — until #462 found it by hand. This job is the standing check.
    #
    # Resolution only, not a full `docker build`. The failure class being guarded is a dependency
    # graph with no solution and a Requires-Python floor above the base image's Python; both are
    # decided entirely during resolution, so a dry-run reaches the same verdict in a couple of
    # minutes instead of pulling and installing ~2 GB of scientific-Python wheels on every PR.
    # Runner and image are both glibc x86_64, so wheel selection matches; what this deliberately
    # does NOT cover is anything that only fails at install/runtime inside the container (a missing
    # apt-level shared library, a build that needs a compiler). Those belong to an image build, not
    # to a per-PR gate.
    #
    # TRIAGING A RED HERE: this gate is non-hermetic BY DESIGN. Direct dependencies are `==`-pinned
    # but their transitives float, so a new upstream release can turn this job red on a PR that
    # touches nothing Python. That is the gate working, not a flake — the image build would break
    # identically. Read it as "requirements.txt has drifted out of resolvability; pin the offending
    # transitive", never as "rerun it". A rerun that goes green only means the index moved again.
    name: PythonMCPServer requirements resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: McpServers/PythonMCPServer/Docker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The version is READ OUT OF THE DOCKERFILE, never pinned here. A gate hardcoding 3.10 keeps
      # certifying 3.10 after someone bumps the base image — the same silent drift between what ships
      # and what is checked that let the original breakage survive. Failing loudly on an unparseable
      # FROM line is the point too: a gate that cannot find its target must not quietly pass.
      #
      # The trailing alternation has to admit whitespace, not just `.`/`-`/EOL: the tag suffix is
      # `[^[:space:]]*` and anything after it (` AS builder`, a stray CR from a CRLF Dockerfile) is a
      # separate optional group. Without that, `FROM python:3.10 AS builder` matched nothing and the
      # job failed with an error that named the symptom but not the cause (#480).
      #
      # The failure message's `grep` is DIAGNOSTIC ONLY and is deliberately looser than the parse
      # above: case-insensitive and tolerant of leading whitespace, so a `from python:3.10` or an
      # indented one appears in the output instead of an empty `got:` that reads as "no FROM line at
      # all". Loosening the parse itself is a separate question and not this one.
      #
      # `tail -n1` — not `head -n1` — because in a multi-stage Dockerfile the image that actually
      # ships is the LAST stage. Taking the first `FROM python:` would certify the builder stage's
      # interpreter while the runtime stage ran a different one.
      - name: Read the image's Python version
        id: python-version
        run: |
          version="$(sed -nE 's/^FROM[[:space:]]+python:([0-9]+\.[0-9]+)([.-][^[:space:]]*)?([[:space:]].*)?$/\1/p' Dockerfile | tail -n1)"
          if [ -z "$version" ]; then
            echo "::error::Could not parse a 'FROM python:<major>.<minor>...' line from Dockerfile. Expected a line like 'FROM python:3.10-slim' or 'FROM python:3.10 AS builder'; got: $(grep -in '^[[:space:]]*FROM' Dockerfile | tr '\n' ' ')" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Dockerfile targets Python $version"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.python-version.outputs.version }}
          cache: pip
          cache-dependency-path: McpServers/PythonMCPServer/Docker/requirements.txt

      # --dry-run resolves the full graph and downloads only the metadata it needs to do so.
      # --ignore-installed keeps the verdict independent of whatever the runner image ships
      # preinstalled, so the answer is about requirements.txt and the Python version alone.
      - name: Resolve requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install --dry-run --ignore-installed -r requirements.txt
