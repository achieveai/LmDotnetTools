name: Build and Test

on:
  # Manual trigger. The only other events here are webhook-driven, and when GitHub drops
  # those there is no recovery path: a dropped `pull_request` never creates a check suite,
  # so there is no run to re-run and nothing for `gh workflow run` to invoke. That happened
  # to this repo on 2026-08-06 — four consecutive commits on a PR branch, zero check suites
  # each, nothing queued, and a new push the only way to get a run at all. This is the lever
  # for that case.
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x

      - name: Validate build and tests
        shell: pwsh
        run: ./scripts/ci-test.ps1

  clientapp-tests:
    name: ClientApp unit tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: samples/LmStreaming.Sample/ClientApp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: samples/LmStreaming.Sample/ClientApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The client's fast unit layer, on every PR. Before this job the ~270 identity test lines
      # (#347/#348 - including the expire()/token-provider regression BE3 fixed) ran in NO always-on
      # CI job: only inside the path-filtered browser E2E workflow, behind a full SPA + Playwright
      # bring-up, so a red client suite could ship on a PR that did not touch the E2E trigger paths.
      # This runs them here, in seconds.
      #
      # Type-checks the vitest suite (tsconfig.vitest.json), which the app tsconfig deliberately
      # excludes. #406 cleared the ~11 test files with pre-existing errors this surfaced; this step
      # now gates so a renamed export, changed signature, or wrong mock shape fails CI instead of
      # rotting silently until someone runs the tests.
      - name: Type-check tests (vitest)
        run: npm run type-check:test

      - name: Run unit tests (vitest)
        run: npm run test:run

  python-requirements:
    # Nothing in CI has ever built McpServers/PythonMCPServer's image, so nothing ever noticed when
    # its requirements set stopped resolving. Two security bumps (bokeh==3.8.2, geopandas==1.1.2)
    # left `pip install -r requirements.txt` failing outright on the image's own base for MONTHS —
    # panel 1.3.6 caps bokeh at <3.4 — until #462 found it by hand. This job is the standing check.
    #
    # Resolution only, not a full `docker build`. The failure class being guarded is a dependency
    # graph with no solution and a Requires-Python floor above the base image's Python; both are
    # decided entirely during resolution, so a dry-run reaches the same verdict in a couple of
    # minutes instead of pulling and installing ~2 GB of scientific-Python wheels on every PR.
    # Runner and image are both glibc x86_64, so wheel selection matches; what this deliberately
    # does NOT cover is anything that only fails at install/runtime inside the container (a missing
    # apt-level shared library, a build that needs a compiler). Those belong to an image build, not
    # to a per-PR gate.
    name: PythonMCPServer requirements resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: McpServers/PythonMCPServer/Docker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The version is READ OUT OF THE DOCKERFILE, never pinned here. A gate hardcoding 3.10 keeps
      # certifying 3.10 after someone bumps the base image — the same silent drift between what ships
      # and what is checked that let the original breakage survive. Failing loudly on an unparseable
      # FROM line is the point too: a gate that cannot find its target must not quietly pass.
      - name: Read the image's Python version
        id: python-version
        run: |
          version="$(sed -nE 's/^FROM[[:space:]]+python:([0-9]+\.[0-9]+)([.-].*)?$/\1/p' Dockerfile | head -n1)"
          if [ -z "$version" ]; then
            echo "::error::Could not parse a 'FROM python:<major>.<minor>...' line from Dockerfile." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Dockerfile targets Python $version"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.python-version.outputs.version }}
          cache: pip
          cache-dependency-path: McpServers/PythonMCPServer/Docker/requirements.txt

      # --dry-run resolves the full graph and downloads only the metadata it needs to do so.
      # --ignore-installed keeps the verdict independent of whatever the runner image ships
      # preinstalled, so the answer is about requirements.txt and the Python version alone.
      - name: Resolve requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install --dry-run --ignore-installed -r requirements.txt
