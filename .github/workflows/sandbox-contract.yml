# Sandbox SDK live-contract CI.
#
# Runs the Sandbox.Integration.Tests matrix against the REAL published gateway with
# AUTH_ENFORCE=true and the Docker backend — no mocks, no in-process fakes. This
# is the only sandbox backend that runs on GitHub-hosted runners (the gateway's
# `local` backend is Windows-only; its native-Linux jail backend needs self-hosted
# VMs with real kernel primitives). The Docker backend gives the SDK the POSIX
# `/workspace` contract its command/file orchestration is built on, and matches
# what real SDK consumers (Linux Docker sandboxes) actually hit.
#
# Images are pulled from GHCR (private to the achieveai org):
#   ghcr.io/achieveai/mcp-gateway        — the gateway host process (containerized)
#   ghcr.io/achieveai/llm-sandbox-agent  — the per-sandbox agent image the gateway execs into
#
# ACCESS: the built-in GITHUB_TOKEN (permissions: packages: read) can pull these
# when the packages grant read access to this repo. If that access is not granted,
# set repo secret SANDBOX_GHCR_TOKEN to a token (read:packages) and it is preferred.
# Forks never run (owner gate).
name: Sandbox Live Contract

on:
  pull_request:
    paths:
      - 'src/Sandbox/**'
      - 'src/LmAgentInfra/Sandbox/**'
      - 'src/LmAgentInfra/Auth/**'
      - 'src/LmAgentInfra/Controllers/AuthWebhookController.cs'
      - 'samples/LmStreaming.Sample/**'
      - 'tests/LmStreaming.Sample.Tests/**'
      - 'tests/LmStreaming.Sample.E2E.Tests/**'
      - 'samples/CodeReviewDaemon.Sample/Workspace/Sandbox/**'
      - 'tests/Sandbox.Integration.Tests/**'
      - '.github/workflows/sandbox-contract.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: sandbox-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the gateway + agent image tag the SDK contract is verified against.
  # Bump deliberately when adopting a newer gateway contract.
  # 0.1.14 is the paired gateway/agent release available on 2026-10-01. GHCR
  # retention keeps only a short tail of tags: 0.1.4 vanished once (leaving 0.1.6-0.1.8),
  # then 0.1.8 vanished too (leaving 0.1.9-0.1.11), and each time the pin made this job
  # fail at `docker pull` before exercising any SDK contract (#773). Retention has
  # now removed 0.1.11 too; both 0.1.14 manifests were verified before this bump.
  #
  # WHICH GATEWAY CONTRACT THIS TAG CARRIES. #187 named
  # SandboxedOstoolsMcpServer@c0dc9cfee3e3aeafd4c3d203ef7153255a990bb6 as the minimum
  # tested contract, and that commit is still the pinned reference for the *catalog and
  # session-discovery* wire shapes (see the fixture citation in
  # tests/Sandbox.Tests/SandboxClientCatalogTests.cs). The SDK's effective minimum is now
  # HIGHER than that commit, not equal to it: ADR 0031 / #119 moved command execution and
  # file transfer onto the gateway's direct operations/files/directories REST API, which
  # did NOT exist at c0dc9cfe. A gateway at exactly that commit therefore cannot serve
  # this SDK — the SDK requires a release carrying the direct API, of which this tag is
  # the published one. Treat the image tag, not the commit, as the operative pin; the
  # commit records only the older wire shapes the SDK still speaks unchanged.
  #
  # 0.1.11 is also the first release carrying per-sandbox environment variables (upstream
  # SandboxedOstoolsMcpServer #183), which the
  # Env_CreateThenPatch_RoundTrips_AndReachesBash contract test requires. The tag already
  # had to be at least this high for the retention reason above, so nothing moved here —
  # but a future bump must not drop BELOW 0.1.11 or that test loses its route.
  #
  # 0.1.16 is the floor for SandboxAgentLiveContractTests: per-agent state and the /agents
  # routes (upstream ADR 0040) and the executable_not_runnable operation error_code (#198)
  # first ship there. Below it those tests fail, not skip.
  #
  # 0.1.17 is the floor for SandboxSkillTiersLiveContractTests: per-agent skill tiers
  # (upstream ADR 0041: the create `skills` block and GET/PATCH /sandboxes/{id}/skills)
  # first ship there. Below it that test fails, not skips. Both 0.1.17 manifests were
  # verified before this bump.
  # 0.1.18 is the floor for SandboxMcpPolicyLiveContractTests: MCP library create policy,
  # secret-free manifests and Docker-shipped sbx-mcp first ship there (upstream ADR 0046).
  # Gateway and agent remote tag manifests were verified before this bump.
  #
  # Bump the external/SandboxedOstoolsMcpServer submodule with this tag: it points at the
  # gateway release commit of the same version (v0.1.18 = 1f5b4ada), so the gateway source
  # the SDK speaks to is one checkout away. CI does not build from it; it pulls these images.
  IMAGE_TAG: '0.1.18'
  GATEWAY_IMAGE: ghcr.io/achieveai/mcp-gateway
  AGENT_IMAGE: ghcr.io/achieveai/llm-sandbox-agent
  PROXY_IMAGE: ghcr.io/achieveai/egress-proxy
  GATEWAY_PORT: '3987'
  GATEWAY_APP_ID: wi187-ci
  # Alias of the committed fixture marketplace (tests/Sandbox.Integration.Tests/Fixtures/marketplace).
  FIXTURE_MARKETPLACE: lmtest

jobs:
  sandbox-contract:
    name: Live contract (Docker backend, auth-enforced)
    runs-on: ubuntu-latest
    # Only the upstream org has the private images; forks skip entirely.
    if: github.repository_owner == 'achieveai'
    timeout-minutes: 25
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            8.0.x

      - name: Log in to GHCR
        # Prefer a dedicated read:packages PAT when configured; otherwise fall back
        # to the workflow token (works when the packages grant this repo read access).
        env:
          GHCR_TOKEN: ${{ secrets.SANDBOX_GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull gateway + agent images
        run: |
          docker pull "${GATEWAY_IMAGE}:${IMAGE_TAG}"
          docker pull "${AGENT_IMAGE}:${IMAGE_TAG}"
          docker pull "${PROXY_IMAGE}:${IMAGE_TAG}"

      # Warm the agent image once outside the assertion window: the very first
      # sandbox container after a fresh pull can transiently fail its first exec
      # while image layers unpack. Failures here are non-fatal.
      - name: Warm agent image
        run: docker run --rm "${AGENT_IMAGE}:${IMAGE_TAG}" /bin/agent-cli list --path /workspace || true

      - name: Generate ephemeral credentials
        id: authcreds
        run: |
          app_secret="$(openssl rand -base64 32)"
          proxy_cred="$(openssl rand -base64 32)"
          echo "::add-mask::$app_secret"
          echo "::add-mask::$proxy_cred"
          echo "app_secret=$app_secret" >> "$GITHUB_OUTPUT"
          echo "proxy_cred=$proxy_cred" >> "$GITHUB_OUTPUT"
          # Runtime agents carry this ownership label (not the Compose project label).
          echo "GATEWAY_INSTANCE_ID=$(cat /proc/sys/kernel/random/uuid)" >> "$GITHUB_ENV"

      - name: Prepare isolated MCP proxy network and CA
        run: |
          set -euo pipefail
          docker network create wi187-contract --subnet 172.30.187.0/24
          certs="${RUNNER_TEMP}/mcp-canary-certs"
          mkdir -p "$certs"
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:prime256v1 -out "$certs/ca.key"
          openssl req -new -x509 -key "$certs/ca.key" -out "$certs/ca.crt" -days 1 \
            -subj '/CN=Ephemeral MCP canary CA' \
            -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign'
          chmod 644 "$certs/ca.key" "$certs/ca.crt"

      - name: Start gateway container (Docker backend, AUTH_ENFORCE=true)
        env:
          APP_SECRET: ${{ steps.authcreds.outputs.app_secret }}
          PROXY_CRED: ${{ steps.authcreds.outputs.proxy_cred }}
        run: |
          set -euo pipefail
          # Host workspace base. The gateway validates paths against this dir and
          # passes them UNCHANGED to the host Docker daemon when spawning agent
          # containers, so it must be bind-mounted at the SAME path inside the
          # gateway container (compose's documented same-path-in-and-out pattern).
          # The mount is RW (not :ro): the gateway provisions per-sandbox
          # subdirectories under WORKSPACE_BASE_PATH; a read-only mount fails
          # sandbox create with "Read-only file system (os error 30)" -> HTTP 500.
          ws="${GITHUB_WORKSPACE}/gw-dws"
          mkdir -p "$ws"
          # The gateway container runs as a non-root user (uid 1000 'gateway') and
          # provisions per-sandbox subdirectories under WORKSPACE_BASE_PATH. On the
          # native-Linux runner the bind mount preserves host ownership, so a dir
          # created by the runner user is NOT writable by uid 1000 -> create fails
          # with "Permission denied (os error 13)" -> HTTP 500. Make the base dir
          # world-writable so the gateway user can create sandbox subdirectories.
          chmod 0777 "$ws"
          # The gateway talks to the host Docker socket via bollard; it must be in
          # the socket's group to open it.
          docker_gid="$(stat -c '%g' /var/run/docker.sock)"
          # AUTH_WEBHOOK_HTTP_LOOPBACK_HOSTS: the agent live-contract test registers an http://127.0.0.1
          # discovery webhook; without the allowlist the gateway refuses the create with 400.
          # PLUGINS_DIRS: the skill-tier live-contract test needs one marketplace plugin with two
          # skills. The committed fixture is mounted read-only at the SAME path inside the gateway,
          # because the gateway also hands that path to the host Docker daemon as the sandbox's
          # /marketplaces/<alias> bind source (same pattern as the workspace base above).
          fx="${GITHUB_WORKSPACE}/tests/Sandbox.Integration.Tests/Fixtures/marketplace"
          injected="${GITHUB_WORKSPACE}/tests/LmStreaming.Sample.E2E.Tests/Fixtures/mcp-injected"
          certs="${RUNNER_TEMP}/mcp-canary-certs"
          docker run -d --name wi187-gateway \
            --network wi187-contract --ip 172.30.187.2 \
            --add-host host.docker.internal:host-gateway \
            -p "127.0.0.1:${GATEWAY_PORT}:3000" \
            --group-add "$docker_gid" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$ws:$ws" \
            -v "$fx:$fx:ro" \
            -v "$injected:$injected:ro" \
            -e "PLUGINS_DIRS=${FIXTURE_MARKETPLACE}=$fx,lminjected=$injected" \
            -e "DEFAULT_MARKETPLACES=${FIXTURE_MARKETPLACE}" \
            -e BIND_ADDRESS=0.0.0.0 \
            -e PORT=3000 \
            -e SANDBOX_BACKEND=docker \
            -e "SANDBOX_IMAGE=${AGENT_IMAGE}:${IMAGE_TAG}" \
            -e SANDBOX_NETWORK=wi187-contract \
            -e GATEWAY_INSTANCE_ID \
            -e "WORKSPACE_BASE_PATH=$ws" \
            -e EGRESS_PROXY_URL=http://172.30.187.3:8080 \
            -e EGRESS_PROXY_EXTRA_HOST=wi187-proxy:172.30.187.3 \
            -e "CA_CERT_HOST_PATH=$certs/ca.crt" \
            -e AUTH_ENFORCE=true \
            -e "APP_SECRETS=${GATEWAY_APP_ID}=${APP_SECRET}" \
            -e "PROXY_SERVICE_CRED=${PROXY_CRED}" \
            -e "GATEWAY_PROXY_CRED=${PROXY_CRED}" \
            -e DB_PATH=/tmp/gw.db \
            -e AUTH_WEBHOOK_HTTP_LOOPBACK_HOSTS=127.0.0.1 \
            -e WEBHOOK_LOOPBACK_REWRITE_HOST=host.docker.internal \
            -e AUTH_WEBHOOK_TRUSTED_HOSTS=host.docker.internal \
            "${GATEWAY_IMAGE}:${IMAGE_TAG}"

      - name: Start MCP egress proxy
        env:
          PROXY_CRED: ${{ steps.authcreds.outputs.proxy_cred }}
        run: |
          certs="${RUNNER_TEMP}/mcp-canary-certs"
          docker run -d --name wi187-proxy --network wi187-contract --ip 172.30.187.3 \
            --add-host host.docker.internal:host-gateway -v "$certs:/certs:ro" \
            -e LISTEN_ADDR=172.30.187.3:8080 -e GATEWAY_URL=http://wi187-gateway:3000 \
            -e CA_CERT_PATH=/certs/ca.crt -e CA_KEY_PATH=/certs/ca.key \
            -e UPSTREAM_CA_CERT_PATH=/certs/ca.crt \
            -e DNS_OVERRIDE=mcp.sbx.test:host.docker.internal \
            -e SSRF_ALLOW_PRIVATE_DNS_OVERRIDE=true \
            -e "GATEWAY_PROXY_CRED=$PROXY_CRED" "${PROXY_IMAGE}:${IMAGE_TAG}"

      - name: Wait for MCP proxy readiness
        run: |
          for i in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Running}}' wi187-proxy)" != true ]; then
              echo "MCP proxy exited before readiness; inspect its startup log." >&2
              exit 1
            fi
            if docker exec wi187-proxy bash -c 'echo > /dev/tcp/172.30.187.3/8080' 2>/dev/null; then
              echo "MCP proxy ready on attempt ${i}"
              exit 0
            fi
            sleep 1
          done
          echo "MCP proxy not ready after 30 attempts" >&2
          exit 1

      - name: Wait for gateway health
        run: |
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:${GATEWAY_PORT}/health" > /dev/null; then
              echo "Gateway healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Gateway did not become healthy in 60s" >&2
          docker logs wi187-gateway >&2 || true
          exit 1

      # /health does not touch the plugin catalog, and a cold gateway's first preview can come
      # back without the plugins it serves. Poll the authenticated preview until the fixture
      # plugin lists both skills, so the skill-tier test never starts against a cold catalog.
      - name: Wait for fixture marketplace in the catalog
        env:
          APP_SECRET: ${{ steps.authcreds.outputs.app_secret }}
        run: |
          deadline=$((SECONDS + 30))
          while [ "$SECONDS" -lt "$deadline" ]; do
            skills="$(curl -sf --max-time 10 \
              -H "X-Sbx-App-Id: ${GATEWAY_APP_ID}" -H "X-Sbx-App-Key: ${APP_SECRET}" \
              "http://127.0.0.1:${GATEWAY_PORT}/api/v1/marketplaces/preview" \
              | jq --arg m "$FIXTURE_MARKETPLACE" \
                '[.marketplaces[] | select(.alias == $m) | .plugins[] | select(.name == "skilltiers") | .skills[]] | length' \
              || echo 0)"
            if [ "${skills:-0}" -ge 2 ]; then
              echo "Fixture plugin listed with ${skills} skills after ${SECONDS}s"
              exit 0
            fi
            sleep 1
          done
          echo "The catalog did not list the fixture plugin's two skills within 30s" >&2
          docker logs wi187-gateway >&2 || true
          exit 1

      - name: Run live contract matrix (net8.0 + net9.0)
        env:
          SANDBOX_BASE_URL: http://127.0.0.1:${{ env.GATEWAY_PORT }}
          SANDBOX_APP_ID: ${{ env.GATEWAY_APP_ID }}
          SANDBOX_APP_KEY: ${{ steps.authcreds.outputs.app_secret }}
          # Absence of a usable gateway is a HARD failure here (no silent skip).
          SANDBOX_CONTRACT_REQUIRED: 'true'
        run: >-
          dotnet test tests/Sandbox.Integration.Tests/AchieveAi.LmDotnetTools.Sandbox.Integration.Tests.csproj
          -c Release

      - name: Run actual-app injected MCP canary (net9.0)
        env:
          SANDBOX_BASE_URL: http://127.0.0.1:${{ env.GATEWAY_PORT }}
          SANDBOX_APP_ID: ${{ env.GATEWAY_APP_ID }}
          SANDBOX_APP_KEY: ${{ steps.authcreds.outputs.app_secret }}
          SANDBOX_CONTRACT_REQUIRED: 'true'
          SANDBOX_CANARY_CA_CERT: ${{ runner.temp }}/mcp-canary-certs/ca.crt
          SANDBOX_CANARY_CA_KEY: ${{ runner.temp }}/mcp-canary-certs/ca.key
        run: >-
          dotnet test tests/LmStreaming.Sample.E2E.Tests/LmStreaming.Sample.E2E.Tests.csproj
          -c Release --filter FullyQualifiedName~SandboxMcpInjectedLiveTests

      - name: Run callback acquisition deadline and cancellation regressions
        run: >-
          dotnet test tests/LmStreaming.Sample.Tests/LmStreaming.Sample.Tests.csproj -c Release
          --filter 'FullyQualifiedName~AuthRequest_StalledProviderIgnoringCancellation_ReturnsPendingWithinTheDeadline|FullyQualifiedName~AuthRequest_CallerCancelledDuringAcquisition_PropagatesCancellation'

      - name: Dump gateway log on failure
        if: failure()
        run: |
          docker logs wi187-gateway || true
          docker logs wi187-proxy || true

      - name: Stop gateway
        if: always()
        run: |
          docker rm -f wi187-gateway wi187-proxy || true
          if [ -n "${GATEWAY_INSTANCE_ID:-}" ]; then
            docker ps -aq --filter "label=gateway-instance=${GATEWAY_INSTANCE_ID}" | xargs -r docker rm -f
          fi
          docker network rm wi187-contract || true
