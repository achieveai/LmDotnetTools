<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 790" role="img" aria-labelledby="title desc">
  <title id="title">Numbered sandbox app request flow</title>
  <desc id="desc">Requests 1 and 2 establish an app grant. Each page, asset, form, or data request numbered 3 through 6 passes from browser to host to sandbox gateway to one CGI process. The response streams back through the host to the browser.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#236990"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #17324d; }
    .phase { font-size: 18px; font-weight: 700; letter-spacing: 1px; fill: #236990; }
    .name { font-size: 22px; font-weight: 700; }
    .detail { font-size: 17px; }
    .hint { font-size: 16px; font-weight: 600; fill: #236990; }
    .box { fill: #f1f7fb; stroke: #a7c7da; stroke-width: 2; }
    .arrow { fill: none; stroke: #236990; stroke-width: 3; marker-end: url(#arrow); }
    .return { fill: #e8f5ee; stroke: #94c3a7; stroke-width: 2; }
  </style>
  <rect width="760" height="790" fill="#ffffff"/>
  <text x="36" y="38" class="phase">OPEN APP · REQUESTS 1–2</text>

  <rect x="36" y="55" width="688" height="78" rx="12" class="box"/>
  <text x="56" y="87" class="name">1 · Host page</text>
  <text x="56" y="114" class="detail">Logged-in user opens an administrator-approved app.</text>
  <path d="M 380 134 V 157" class="arrow"/>
  <rect x="36" y="166" width="688" height="78" rx="12" class="box"/>
  <text x="56" y="198" class="name">2 · App origin</text>
  <text x="56" y="225" class="detail">One-use POST ticket sets a host-only HttpOnly cookie.</text>

  <text x="36" y="286" class="phase">EACH APP REQUEST · 3–6</text>
  <rect x="36" y="302" width="688" height="78" rx="12" class="box"/>
  <text x="56" y="334" class="name">Browser</text>
  <text x="56" y="361" class="detail">3 Page · 4 Asset · 5 Form · 6 fetch / XMLHttpRequest</text>
  <path d="M 380 381 V 403" class="arrow"/>
  <rect x="36" y="412" width="688" height="78" rx="12" class="box"/>
  <text x="56" y="444" class="name">Host</text>
  <text x="56" y="471" class="detail">Check app grant, write access, route, and CSRF if needed.</text>
  <path d="M 380 491 V 513" class="arrow"/>
  <rect x="36" y="522" width="688" height="78" rx="12" class="box"/>
  <text x="56" y="554" class="name">Sandbox gateway</text>
  <text x="56" y="581" class="detail">Start one bounded process; stop on cancel or timeout.</text>
  <path d="M 380 601 V 623" class="arrow"/>
  <rect x="36" y="632" width="688" height="78" rx="12" class="box"/>
  <text x="56" y="664" class="name">CGI program</text>
  <text x="56" y="691" class="detail">Route URL; read request; stream stdout.</text>

  <rect x="36" y="734" width="688" height="42" rx="10" class="return"/>
  <text x="56" y="761" class="hint">Response: program → gateway → host → browser</text>
</svg>
