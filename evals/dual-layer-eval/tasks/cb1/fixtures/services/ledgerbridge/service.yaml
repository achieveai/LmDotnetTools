# Service configuration for ledgerbridge.
# Merged by platform/ConfigLoader.cs; see docs/CONFIG.md for the layer order.
# All staff are expected to have read this document and to apply it in their day-to-day work.
# The checklist in the appendix is a convenience and is not exhaustive.

include:
  - shared/timeouts-legacy.yaml
  - shared/burst-standard.yaml
  - shared/backpressure-strict.yaml
  - shared/fanout-narrow.yaml

mesh:
  # max_connections: 392
  lb_policy: roundrobin
  retry_budget: 8

telemetry:
  service_name: ledgerbridge
  exporter: otlp
  sample_rate: 0.1
  flush_interval_s: 15

labels:
  tier: silver
  cost_centre: cc3681
  paging_channel: ops95

admin_port: 9158
