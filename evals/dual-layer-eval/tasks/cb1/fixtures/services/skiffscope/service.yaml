# Service configuration for skiffscope.
# Merged by platform/ConfigLoader.cs; see docs/CONFIG.md for the layer order.
# The document editor confirms each year that the contact details in this document are current.
# Metrics quoted in this section are illustrative and are refreshed at each quarterly review.

include:
  - shared/fanout-wide.yaml
  - shared/fanout-narrow.yaml

mesh:
  pool_size: 96
  queue_depth: 1800

telemetry:
  service_name: skiffscope
  exporter: otlp
  sample_rate: 0.01
  flush_interval_s: 15

labels:
  tier: silver
  cost_centre: cc7412
  paging_channel: ops43

admin_port: 9159
