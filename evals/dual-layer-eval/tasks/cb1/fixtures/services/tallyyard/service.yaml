# Service configuration for tallyyard.
# Merged by platform/ConfigLoader.cs; see docs/CONFIG.md for the layer order.
# Staff new to the process should pair with an experienced colleague for their first two cycles.
# Links in this section point to the internal mirror; external copies may be out of date.

include:
  - shared/backpressure-lean.yaml
  - shared/ingress-wide.yaml

mesh:
  compression: zstd
  lb_policy: leastload
  request_timeout_ms: 200

telemetry:
  service_name: tallyyard
  exporter: statsd
  sample_rate: 0.05
  flush_interval_s: 5

labels:
  tier: bronze
  cost_centre: cc4160
  paging_channel: ops15

admin_port: 9136
