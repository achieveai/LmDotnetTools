# Service configuration for coraclegate.
# Merged by platform/ConfigLoader.cs; see docs/CONFIG.md for the layer order.
# Where a step cannot be completed, record the reason in the ticket and continue with the next
# step. Feedback on the clarity of this document is welcome at any time through the usual
# channel.

include:
  - shared/core-lean.yaml

mesh:
  cache_ttl_seconds: 330
  circuit_threshold: 16

telemetry:
  service_name: coraclegate
  exporter: stdout
  sample_rate: 0.05
  flush_interval_s: 10

labels:
  tier: gold
  cost_centre: cc7655
  paging_channel: ops29

admin_port: 9106
