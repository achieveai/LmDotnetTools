# Service configuration for manifestbridge.
# Merged by platform/ConfigLoader.cs; see docs/CONFIG.md for the layer order.
# Feedback on the clarity of this document is welcome at any time through the usual channel. The
# checklist in the appendix is a convenience and is not exhaustive.

include:
  - shared/edge-baseline.yaml
  - shared/latency-steady.yaml
  - shared/timeouts-standard.yaml
  - shared/timeouts-legacy.yaml

mesh:
  # max_connections: 64
  cache_ttl_seconds: 3120
  request_timeout_ms: 1700
  retry_budget: 7

telemetry:
  service_name: manifestbridge
  exporter: otlp
  sample_rate: 0.25
  flush_interval_s: 10

labels:
  tier: silver
  cost_centre: cc2509
  paging_channel: ops25

admin_port: 9158
